[package]
name = "wayime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "7"
hf-hub = { version = "1.0", features = ["blocking"] }
libc = "0.2.191"
# rquickjs = "0.14.0"
rquickjs = { package = "quickjs-jit", version = "=0.14.1" }
rquickjs-jit = {
    package = "quickjs-jit-runtime",
    version = "=0.14.1",
    features = ["compiler"],
}
rusqlite = { version = "0.41", features = ["bundled", "cache", "hooks"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt"]
}
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

cpal = "0.18"
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan"] }
ferrous-opencc = "0.4.0"
